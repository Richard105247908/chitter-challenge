<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Peep</title>
</head>
<body>
<h1>Post a Peep</h1>

<p th:if="${error}" th:text="${error}"></p>

<form th:action="@{/peeps}" method="post">
    <label for="message">Message</label>
    <textarea id="message" name="message" maxlength="200" th:text="${message}"></textarea>
    <button type="submit">Post</button>
</form>
</body>
</html>
