<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Peep</title>
</head>
<body>
<main>
    <h1>Post a Peep</h1>
    <form method="post" th:action="@{/peeps}">
        <label for="message">Message</label>
        <textarea id="message" name="message" maxlength="200"></textarea>
        <button type="submit">Peep</button>
    </form>
</main>
</body>
</html>
