<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chitter</title>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main>
    <h1>Chitter</h1>
    <article th:each="peep : ${peeps}">
        <p th:text="|${peep.authorName} (@${peep.authorUsername})|">Author (@username)</p>
        <p th:text="${peep.message}">Peep message</p>
        <time th:datetime="${peep.createdAt}"
              th:text="|${#temporals.format(peep.createdAt, 'd MMM yyyy, HH:mm', T(java.util.Locale).ENGLISH)} UTC|">19 Nov 2026, 15:05 UTC</time>
    </article>
</main>
</body>
</html>
