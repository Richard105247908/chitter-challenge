<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="nav">
    <a th:href="@{/peeps}">Chitter</a>
    <span th:if="${currentUsername == null}">
        <a th:href="@{/sessions/new}">Log in</a>
        <a th:href="@{/users/new}">Sign up</a>
    </span>
    <span th:if="${currentUsername != null}">
        <span th:text="${currentUsername}"></span>
        <a th:href="@{/peeps/new}">New peep</a>
        <form method="post" th:action="@{/sessions/delete}">
            <button type="submit">Log out</button>
        </form>
    </span>
</nav>
</body>
</html>
