<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
</head>
<body>
<main>
    <h1>Sign Up</h1>

    <p th:if="${error}" th:text="${error}"></p>

    <form method="post" th:action="@{/users}">
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" th:value="${email}" required />        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" required />        </div>
        <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" th:value="${name}" required />        </div>
        <div>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" th:value="${username}" required />        </div>
        <button type="submit">Sign Up</button>
    </form>
</main>
</body>
</html>
